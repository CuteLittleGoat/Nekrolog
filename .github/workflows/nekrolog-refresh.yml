name: Nekrolog refresh

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Dlaczego uruchomiono odświeżenie"
        required: false
        default: "manual_dispatch"
  schedule:
    - cron: "0 7,19 * * *"

concurrency:
  group: nekrolog-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run refresh
        env:
          REFRESH_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || github.event.inputs.reason || 'manual_dispatch' }}
        run: npm run refresh
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/job.json data/errors.json config/sources.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh Nekrolog data"
            git push
          fi
